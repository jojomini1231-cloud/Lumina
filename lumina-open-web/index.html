<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina 用户端</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Cpath d='M20 14h8v30h18v7H20z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="brand">
          <span class="brand-mark">L</span>
          <span>Lumina Open</span>
        </div>
        <div class="hero-grid">
          <div class="hero-copy">
            <p class="eyebrow">API Key Console</p>
            <h1>查询密钥额度与可用模型</h1>
            <p class="subtitle">输入你的密钥，即可查看当前可用请求次数、已使用请求次数，以及该密钥可访问的模型。</p>
          </div>
          <form class="query-panel" id="queryForm">
            <label for="apiKey">密钥</label>
            <div class="input-row">
              <input id="apiKey" name="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
              <button type="button" class="icon-button" id="toggleKey" aria-label="显示或隐藏密钥" title="显示或隐藏密钥">
                <span id="toggleKeyIcon">显示</span>
              </button>
            </div>
            <button class="primary-button" type="submit" id="submitButton">查询</button>
            <p class="form-message" id="formMessage" role="status"></p>
          </form>
        </div>
      </section>

      <section class="results hidden" id="results">
        <div class="summary-head">
          <div>
            <p class="eyebrow">Key Status</p>
            <h2 id="keyName">密钥概览</h2>
          </div>
          <span class="status-pill" id="statusPill">Active</span>
        </div>

        <div class="metrics">
          <article class="metric-card">
            <span>可用请求次数</span>
            <strong id="availableRequests">-</strong>
          </article>
          <article class="metric-card">
            <span>已使用请求次数</span>
            <strong id="usedRequests">-</strong>
          </article>
          <article class="metric-card">
            <span>请求次数上限</span>
            <strong id="maxRequests">-</strong>
          </article>
          <article class="metric-card">
            <span>成功请求</span>
            <strong id="successRequests">-</strong>
          </article>
        </div>

        <div class="model-head">
          <div>
            <p class="eyebrow">Models</p>
            <h2>可用模型</h2>
          </div>
          <span id="modelScope">-</span>
        </div>
        <div class="model-grid" id="modelGrid"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
